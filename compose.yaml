services:
  db:
    image: postgres:16-alpine
    networks: [default, media-render]
    environment:
      POSTGRES_USER: brand
      POSTGRES_PASSWORD: brand
      POSTGRES_DB: brand_intelligence
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand -d brand_intelligence"]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    build: .
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://brand:brand@db:5432/brand_intelligence
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    volumes: ["chatgpt_credentials:/srv/chatgpt", "media_data:/srv/media"]
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://brand:brand@db:5432/brand_intelligence
      CHATGPT_AUTH_DIR: /srv/chatgpt
      MEDIA_STORAGE_PATH: /srv/media
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    volumes: ["chatgpt_credentials:/srv/chatgpt"]
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://brand:brand@db:5432/brand_intelligence
      CHATGPT_AUTH_DIR: /srv/chatgpt
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  render-worker:
    build:
      context: .
      dockerfile: Dockerfile.render
    environment:
      DATABASE_URL: postgresql+psycopg://brand:brand@db:5432/brand_intelligence
      MEDIA_STORAGE_PATH: /srv/media
      RENDER_BROWSER_EXECUTABLE: /usr/bin/chromium
    volumes: ["media_data:/srv/media"]
    networks: [media-render]
    init: true
    cpus: 2
    mem_limit: 3g
    pids_limit: 384
    shm_size: 512mb
    stop_grace_period: 11m
    depends_on:
      migrate: {condition: service_completed_successfully}
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: brand
      POSTGRES_PASSWORD: brand
      POSTGRES_DB: brand_intelligence_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand -d brand_intelligence_test"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:

  chatgpt_credentials:
  media_data:

networks:
  media-render:
    internal: true
