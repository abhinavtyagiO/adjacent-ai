name: Backend checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brand
          POSTGRES_PASSWORD: brand
          POSTGRES_DB: brand_intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brand -d brand_intelligence_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://brand:brand@localhost:5432/brand_intelligence_test
      TEST_DATABASE_URL: postgresql+psycopg://brand:brand@localhost:5432/brand_intelligence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
